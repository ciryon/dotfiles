# Keybindings

# Lazygit
bind C-g popup -d "#{pane_current_path}" -w 90% -h 70% -E lazygit

# Terminal
bind C-t popup -d "#{pane_current_path}" -w 95% -h 30% -E $SHELL

# Jump to dir
bind C-j popup -d "#{pane_current_path}" -w 160 -h 30% -E ~/.local/bin/tmux-zoxide-cd.sh

# New window: prompt for a name and a tmux-dashboard description (centered popup).
# The helper addresses the new window by id, so the prompt cannot land on
# whichever window happened to be selected.
bind C run-shell -b '$HOME/.local/bin/tmux-describe new "#{pane_id}"'

# Edit this window's dashboard description (replaces the default choose-client).
bind D run-shell -b '$HOME/.local/bin/tmux-describe edit "#{pane_id}"'
#bind C command-prompt -p "Window name:" "new-window -c '#{pane_current_path}' -n '%%'"


# Passthrough OSC 9 (bell):
  set -g allow-passthrough on
  set -ga update-environment TERM
  set -ga update-environment TERM_PROGRAM


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'
# Resurrect plugin
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes '"~claude->claude --continue"'

# Continuum: autosave resurrect state every 15 min
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'

# tmux-fingers, Vimuium styule navigation
# plus fix for url with trailing dot
# plus alt-ctrl to open link in background
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-pattern-0 'https?://[^\s()"]*[^\s()".,!?;:]'
set -g @fingers-alt-action '/home/ciryon/.local/bin/open-url-background'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


# tmux 3.6 defaults popups to grey; use terminal colors
set -g popup-style bg=default,fg=default
set -g popup-border-style bg=default,fg=themelightgrey
