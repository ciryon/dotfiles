# Keybindings

# Lazygit
bind C-g popup -d "#{pane_current_path}" -w 90% -h 70% -E lazygit

# Terminal
bind C-t popup -d "#{pane_current_path}" -w 95% -h 30% -E $SHELL

# Jump to dir
bind C-j popup -d "#{pane_current_path}" -w 95% -h 30% -E ~/.local/bin/tmux-zoxide-cd.sh

# New window with name prompt (centered popup)
bind C new-window -c "#{pane_current_path}" \; display-popup -w 40 -h 3 -E 'read -p "Window name: " name && tmux rename-window "$name"'
#bind C command-prompt -p "Window name:" "new-window -c '#{pane_current_path}' -n '%%'"


# Passthrough OSC 9 (bell):
  set -g allow-passthrough on
  set -ga update-environment TERM
  set -ga update-environment TERM_PROGRAM


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'
# Resurrect plugin
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

